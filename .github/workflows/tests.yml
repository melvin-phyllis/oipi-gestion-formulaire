name: Tests RISFM

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: risfm-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Laravel, Vite et sécurité navigateur
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: risfm_test
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Configurer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_sqlite, dom, gd, zip, xmlreader, xmlwriter, fileinfo
          coverage: none
          tools: composer:v2

      - name: Configurer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances PHP
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Installer les dépendances JavaScript
        run: npm ci

      - name: Préparer Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Vérifier les migrations MySQL
        run: php artisan migrate:fresh --force
        env:
          APP_ENV: testing
          APP_DEBUG: false
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: risfm_test
          DB_USERNAME: root
          DB_PASSWORD: password
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

      - name: Compiler les assets Vite
        run: npm run build

      - name: Exécuter les tests Laravel
        run: php artisan test --compact

      - name: Exécuter les tests de sécurité navigateur
        run: npm run test:security
        env:
          BROWSER_BIN: google-chrome
